<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>汉字拼拼乐 - 果树版</title>
<style>
/* ===== 重置与变量 ===== */
*,::before,::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f8fc;--card:#ffffff;--primary:#4a90d9;--success:#52c47a;
  --error:#ff7875;--text:#2d3a4a;--text-light:#8c99a8;--border:#dfe6ef;
  --radius:16px;--tree-trunk:#8B4513;--tree-leaf:#2f9e5f;--fruit-glow:#ffd600;
  --font-kai:'KaiTi','STKaiti','楷体','微软雅黑',sans-serif;
}
html,body{height:100%;background:transparent;font-family:var(--font-kai);color:var(--text);line-height:1.5;user-select:none;-webkit-user-select:none}
#app{position:relative;z-index:10;display:flex;flex-direction:column;min-height:100vh;padding:16px;gap:12px;max-width:560px;margin:0 auto}

/* ===== 果树背景层 ===== */
#fruitTree{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fruitTree .sky{position:absolute;inset:0;background:linear-gradient(#bfe9ff,#e8f7ff 68%,#eaf8dc);z-index:0}
#fruitTree .orchard-hills{position:absolute;left:-8%;right:-8%;bottom:9%;height:28%;background:linear-gradient(160deg,#9ed36a,#63ae4b);border-radius:50% 50% 0 0 / 35% 35% 0 0;z-index:0;opacity:.8}
#fruitTree .orchard-hills::after{content:'';position:absolute;left:8%;right:4%;bottom:0;height:65%;background:linear-gradient(170deg,#75bd54,#478e3e);border-radius:55% 45% 0 0 / 45% 35% 0 0;opacity:.72}
#fruitTree .orchard-cloud-back{position:absolute;left:33%;top:11%;font-size:34px;opacity:.5;z-index:1;animation:drift 38s linear infinite reverse}
#fruitTree.scene-orchard .blob{display:none}
#fruitTree.scene-orchard .canopy{width:430px;height:300px;top:18%;z-index:1}
#fruitTree.scene-orchard .learning-crown{position:absolute;display:block;border-radius:46% 54% 48% 52% / 52% 46% 54% 48%;box-shadow:inset 18px 18px 25px rgba(255,255,220,.2),inset -20px -18px 25px rgba(20,95,43,.25),0 12px 0 rgba(36,117,61,.15)}
#fruitTree.scene-orchard .crown-back{left:-45px;top:30px;width:520px;height:250px;background:linear-gradient(145deg,#9bd96d,#47a65b 65%,#2d814d)}
#fruitTree.scene-orchard .crown-front{left:42px;top:72px;width:350px;height:205px;background:linear-gradient(145deg,#79ca63,#319450 70%,#267344);z-index:1}
#fruitTree.scene-orchard .crown-leaf{position:absolute;display:block;width:38px;height:70px;border-radius:100% 0 100% 0;background:#b6e875;opacity:.82;z-index:2;transform:rotate(36deg)}
#fruitTree.scene-orchard .crown-leaf.l1{left:42px;top:78px}.crown-leaf.l2{left:120px;top:34px;transform:rotate(74deg)}.crown-leaf.l3{right:50px;top:62px;transform:rotate(112deg)}.crown-leaf.l4{right:90px;bottom:16px;transform:rotate(180deg)}.crown-leaf.l5{left:105px;bottom:8px;transform:rotate(218deg)}
#fruitTree.scene-orchard .radical-sign{position:absolute;top:42%;z-index:6;width:116px;height:92px;padding-top:8px;border:5px solid #c57a3e;border-radius:18px;background:linear-gradient(#fff7c8,#ffe596);color:#75431f;text-align:center;font-size:54px;font-weight:700;line-height:1.1;box-shadow:0 7px 0 rgba(117,67,31,.18),0 0 0 7px rgba(255,255,255,.35);animation:signFloat 4s ease-in-out infinite}
#fruitTree.scene-orchard .radical-sign::after{content:'拼一拼';display:block;font-size:14px;letter-spacing:2px;color:#b56b35}
#fruitTree.scene-orchard .radical-sign.active{border-color:#ffad22;background:linear-gradient(#fff4a6,#ffd35a);animation:radicalPop .7s cubic-bezier(.2,1.5,.4,1),signFloat 4s ease-in-out infinite;box-shadow:0 0 0 8px rgba(255,208,67,.25),0 8px 0 rgba(117,67,31,.18)}
@keyframes radicalPop{0%{transform:scale(.85)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
#fruitTree.scene-orchard .radical-wood{left:7%;transform:rotate(-5deg)}
#fruitTree.scene-orchard .radical-grass{right:7%;transform:rotate(5deg);animation-delay:-2s}
@keyframes signFloat{0%,100%{margin-top:0}50%{margin-top:-7px}}
#fruitTree.scene-orchard .word-path{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);width:320px;height:54px;border-radius:50%;background:repeating-linear-gradient(90deg,#f5d890 0 36px,#e7c272 36px 42px);opacity:.85;z-index:1;box-shadow:0 8px 0 rgba(91,126,50,.22)}
#fruitTree.scene-orchard .word-path::before{content:'偏旁  +  部件  →  汉字';position:absolute;left:0;right:0;top:6px;text-align:center;color:#80502b;font-weight:700;font-size:18px;letter-spacing:2px;text-shadow:0 1px #fff3bd}
#fruitTree .sun{position:absolute;right:8%;top:6%;font-size:52px;z-index:1;filter:drop-shadow(0 0 14px rgba(255,210,60,.8));animation:sunPulse 4s ease infinite}
@keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#fruitTree .cloud{position:absolute;z-index:1;font-size:44px;opacity:.85;animation:drift 30s linear infinite}
#fruitTree .cloud-1{left:6%;top:14%}
#fruitTree .cloud-2{left:12%;top:6%;animation-delay:-15s;font-size:34px}
@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(60px)}}
#fruitTree .ground{position:absolute;bottom:0;left:0;right:0;height:14%;background:linear-gradient(#7ec850,#5aa83f);border-radius:60% 60% 0 0;z-index:0}
#fruitTree .flower-row{position:absolute;left:3%;right:3%;bottom:10%;font-size:22px;letter-spacing:25px;z-index:2;opacity:.9;animation:flowerSway 5s ease-in-out infinite}
@keyframes flowerSway{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* ===== 树干（粗壮、上细下粗，覆盖屏幕中下部） ===== */
#fruitTree .trunk{position:absolute;bottom:13%;left:50%;transform:translateX(-50%);width:76px;height:42%;background:linear-gradient(90deg,#7a4a1f,#b47a45 45%,#8a5a26);border-radius:20px 20px 8px 8px;z-index:1;box-shadow:inset -14px 0 16px rgba(0,0,0,.18)}
#fruitTree .trunk::after{content:'';position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);width:150px;height:28px;background:radial-gradient(ellipse at 50% 50%,#b47a45,#7a4a1f 85%);border-radius:50%;z-index:1}
#fruitTree .branch{position:absolute;bottom:56%;width:190px;height:18px;border-radius:50%;background:linear-gradient(#a66a35,#6f3e1e);box-shadow:0 4px 5px rgba(65,34,14,.25)}
#fruitTree .branch-left{right:35px;transform:rotate(-28deg);transform-origin:right center}
#fruitTree .branch-right{left:35px;transform:rotate(28deg);transform-origin:left center}
.orchard-deco{position:absolute;z-index:4;pointer-events:none}
.orchard-deco.bush{font-size:54px;filter:saturate(1.1);animation:bushBob 5s ease-in-out infinite}
.bush-left{left:2%;bottom:11%}.bush-right{right:2%;bottom:12%;animation-delay:-2s!important}
@keyframes bushBob{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.04) rotate(2deg)}}
.firefly-a,.firefly-b{color:#fff8a8;font-size:24px;text-shadow:0 0 12px #fff176;animation:firefly 3.5s ease-in-out infinite}
.firefly-a{left:17%;top:25%}.firefly-b{right:18%;top:35%;animation-delay:-1.4s}
.butterfly{left:13%;top:38%;font-size:32px;animation:butterflyFloat 7s ease-in-out infinite}
.leaf-drift{right:15%;top:27%;font-size:28px;animation:leafDrift 8s ease-in-out infinite}
@keyframes firefly{0%,100%{opacity:.25;transform:translate(0,0) scale(.8)}50%{opacity:1;transform:translate(12px,-14px) scale(1.15)}}
@keyframes butterflyFloat{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(42px,-24px) rotate(8deg)}}
@keyframes leafDrift{0%{transform:translate(0,-10px) rotate(0);opacity:.3}45%{transform:translate(-35px,40px) rotate(100deg);opacity:1}100%{transform:translate(-70px,80px) rotate(190deg);opacity:0}}
/* ===== 树冠（多层圆球叠加，蓬松圆润） ===== */
#fruitTree .canopy{position:absolute;left:50%;top:26%;transform:translateX(-50%);width:0;height:0;z-index:1}
#fruitTree.scene-orchard .canopy{animation:canopyBreathe 6s ease-in-out infinite}
@keyframes canopyBreathe{0%,100%{filter:saturate(1)}50%{filter:saturate(1.12) brightness(1.04)}}
/* 收集容器：全屏层，各场景在对应主题位点放置收集物 */
#canopyFruit{position:absolute;inset:0;pointer-events:none;z-index:2}
#sceneParticles{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.particle{position:absolute;display:block;pointer-events:none;animation:particleFly .9s cubic-bezier(.2,.8,.25,1) forwards;color:#8a552e;font-size:18px;z-index:9}
.particle.spark{color:#ffe36e;font-size:22px;text-shadow:0 0 9px #fff3a0}
.particle.leaf{color:#55a949}
@keyframes particleFly{0%{opacity:0;transform:translate(0,0) scale(.4) rotate(0)}18%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--rot))}}
.burst-ring{position:absolute;width:26px;height:26px;border:4px solid #ffd45c;border-radius:50%;animation:ringExpand .75s ease-out forwards;z-index:8}
@keyframes ringExpand{0%{opacity:.9;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.8)}}
#fruitTree .blob{position:absolute;border-radius:50%;box-shadow:inset 10px 12px 20px rgba(255,255,215,.2), inset -10px -8px 16px rgba(0,64,20,.28)}
/* 三档颜色：内深绿 → 中绿 → 外层鲜绿（比之前更浓，去雾） */
#fruitTree .blob.deep{background:radial-gradient(circle at 42% 35%,#3f9f63,#256845 85%)}
#fruitTree .blob.mid{background:radial-gradient(circle at 42% 35%,#4db873,#2f8a52 85%)}
#fruitTree .blob.lite{background:radial-gradient(circle at 42% 35%,#63c484,#36a05e 85%)}
/* 主体叶球用真实树叶的不规则轮廓 */
#fruitTree .blob.c1{left:-150px;top:-50px;width:320px;height:300px;border-radius:52% 48% 55% 45% / 55% 48% 52% 45%}
#fruitTree .blob.c2{left:-155px;top:110px;width:310px;height:210px;border-radius:50% 50% 58% 42% / 60% 45% 55% 40%}
#fruitTree .blob.c3{left:-115px;top:-160px;width:245px;height:220px;border-radius:48% 52% 45% 55% / 52% 48% 55% 45%}
/* —— 中层（中绿，填补主体边缝） —— */
#fruitTree .blob.m1{left:-245px;top:-45px;width:210px;height:200px}
#fruitTree .blob.m2{left:35px;top:-45px;width:215px;height:200px}
#fruitTree .blob.m3{left:-310px;top:20px;width:185px;height:175px}
#fruitTree .blob.m4{left:125px;top:20px;width:185px;height:175px}
#fruitTree .blob.m5{left:-250px;top:90px;width:180px;height:165px}
#fruitTree .blob.m6{left:70px;top:90px;width:185px;height:170px}
/* —— 外层（亮绿，树冠外圈) —— */
#fruitTree .blob.l1{left:-100px;top:-235px;width:185px;height:175px}
#fruitTree .blob.l2{left:-430px;top:55px;width:185px;height:175px}
#fruitTree .blob.l3{left:245px;top:55px;width:185px;height:175px}
#fruitTree .blob.l4{left:-375px;top:-15px;width:200px;height:190px}
#fruitTree .blob.l5{left:175px;top:-15px;width:200px;height:190px}
#fruitTree .blob.l6{left:-340px;top:110px;width:155px;height:145px}
#fruitTree .blob.l7{left:185px;top:110px;width:155px;height:145px}
/* —— 左翼（加密：亮绿/中绿错落，不用浅绿） —— */
#fruitTree .blob.e1{left:-465px;top:-95px;width:150px;height:145px}
#fruitTree .blob.e2{left:-515px;top:5px;width:125px;height:120px}
#fruitTree .blob.e3{left:-455px;top:95px;width:140px;height:130px}
#fruitTree .blob.e4{left:-300px;top:-130px;width:140px;height:130px}
#fruitTree .blob.e5{left:-240px;top:150px;width:135px;height:125px}
#fruitTree .blob.e6{left:-400px;top:160px;width:115px;height:105px}
#fruitTree .blob.e7{left:-555px;top:-60px;width:115px;height:110px}
#fruitTree .blob.e8{left:-385px;top:-60px;width:120px;height:110px}
#fruitTree .blob.e9{left:-470px;top:155px;width:120px;height:110px}
/* —— 右翼（加密：亮绿/中绿错落，不用浅绿） —— */
#fruitTree .blob.e10{left:315px;top:-95px;width:150px;height:145px}
#fruitTree .blob.e11{left:390px;top:5px;width:125px;height:120px}
#fruitTree .blob.e12{left:315px;top:95px;width:140px;height:130px}
#fruitTree .blob.e13{left:160px;top:-130px;width:140px;height:130px}
#fruitTree .blob.e14{left:105px;top:150px;width:135px;height:125px}
#fruitTree .blob.e15{left:285px;top:160px;width:115px;height:105px}
#fruitTree .blob.e16{left:440px;top:-60px;width:115px;height:110px}
#fruitTree .blob.e17{left:265px;top:-60px;width:120px;height:110px}
#fruitTree .blob.e18{left:350px;top:155px;width:120px;height:110px}
/* —— 树冠底部包干叶（深绿，抱住树干顶部，让树冠斯树干连成一体） —— */
#fruitTree .blob.x1{left:-215px;top:215px;width:220px;height:170px;border-radius:52% 48% 55% 45% / 55% 48% 52% 45%}
#fruitTree .blob.x2{left:-5px;top:215px;width:220px;height:170px;border-radius:48% 52% 45% 55% / 52% 48% 55% 45%}
/* —— 加密填充叶（填满顶部、两肋与树干交接处的空隙） —— */
#fruitTree .blob.f1{left:-45px;top:-220px;width:130px;height:120px}
#fruitTree .blob.f2{left:-215px;top:-205px;width:120px;height:110px}
#fruitTree .blob.f3{left:85px;top:-205px;width:120px;height:110px}
#fruitTree .blob.f4{left:-315px;top:-95px;width:120px;height:110px}
#fruitTree .blob.f5{left:195px;top:-95px;width:120px;height:110px}
#fruitTree .blob.f6{left:-135px;top:-260px;width:110px;height:100px}
#fruitTree .blob.f7{left:55px;top:-255px;width:110px;height:100px}
#fruitTree .blob.f8{left:-55px;top:5px;width:135px;height:125px}
#fruitTree .blob.f9{left:15px;top:-15px;width:135px;height:125px}
#fruitTree .blob.f10{left:-260px;top:150px;width:125px;height:115px}
#fruitTree .blob.f11{left:150px;top:150px;width:125px;height:115px}
#fruitTree .blob.f12{left:-85px;top:250px;width:135px;height:125px}
#fruitTree .blob.f13{left:20px;top:250px;width:135px;height:125px}
#fruitTree .blob.f14{left:-70px;top:-130px;width:145px;height:135px}
/* ===== 水果（挂在各场景收集位上） ===== */
#fruitTree .fruit{position:absolute;z-index:3;font-size:44px;line-height:1;filter:grayscale(100%);opacity:.85;transition:filter .5s,opacity .5s;text-shadow:0 2px 4px rgba(0,0,0,.2);margin-left:-20px;margin-top:-20px}
#fruitTree .fruit:not(.gathering){animation:fruitSway 3.8s ease-in-out infinite;animation-delay:var(--delay,0s)}
@keyframes fruitSway{0%,100%{margin-top:-20px}50%{margin-top:-24px}}
#fruitTree.scene-garden .fruit{margin:0;transform:translate(-50%,-50%)}
#fruitTree .fruit.unlocked{filter:grayscale(0%);opacity:1}
/* 每簇周围的小果 */
#fruitTree .fruit.small{font-size:26px;opacity:.85;margin-left:-13px;margin-top:-13px}
#fruitTree.scene-garden .fruit.small{margin:0;transform:translate(-50%,-50%)}
@media (max-width:480px){#fruitTree .fruit.small{font-size:21px}}
/* 涟漪点亮：小果弹跳由灰变彩 */
@keyframes rippleUnlock{0%{transform:scale(.3);filter:grayscale(100%)}55%{transform:scale(1.4)}100%{transform:scale(1);filter:grayscale(0%)}}
#fruitTree .fruit.ripple{animation:rippleUnlock .45s ease}
/* 收集底座：每个挂位先放好容器，答对时收集物落到容器里点亮 */
#fruitTree .holder{position:absolute;z-index:1;transition:filter .4s,border-color .4s,box-shadow .4s}
#fruitTree .holder.filled{filter:saturate(1.12)}
/* 果园：果子直接长在树上，不需要底座 */
.scene-orchard .holder{display:none}
/* 菜园：底座就是一块土垄，蔬菜从土垄中长出来 */
.scene-garden .holder{width:132px;height:72px;border-radius:18px;background:linear-gradient(180deg,#a8663a,#744122);border:4px solid #c58a51;transform:translate(-50%,-50%);box-shadow:inset 0 6px 0 rgba(245,190,111,.18),0 10px 0 -4px rgba(73,42,24,.22);z-index:1}
.scene-garden .holder::after{content:'';position:absolute;left:12%;right:12%;top:30%;height:25px;border-radius:50%;background:repeating-linear-gradient(90deg,rgba(61,31,18,.55) 0 10px,transparent 10px 24px);opacity:.7}
.scene-garden .holder.filled{filter:saturate(1.2);box-shadow:0 12px 0 -4px rgba(73,42,24,.2),0 0 0 5px rgba(255,208,79,.25)}
.scene-garden .holder.grow-active{animation:soilThump .55s ease-in-out}
@keyframes soilThump{0%,100%{transform:translate(-50%,-50%) scale(1)}35%{transform:translate(-50%,-50%) scale(1.08,.9)}65%{transform:translate(-50%,-50%) scale(.96,1.08)}}
/* 教室：黑板上的便签贴卡 */
.scene-classroom .holder{width:96px;height:96px;border-radius:14px;background:#fffdf5;border:3px dashed #c9cede;box-shadow:0 2px 8px rgba(0,0,0,.15);transform:translate(-50%,-50%)}
.scene-classroom .holder.filled{border-style:solid;border-color:#52c47a;background:#e6f7ec;box-shadow:0 0 0 5px rgba(82,196,122,.18)}
/* 商店：货架木格 */
.scene-shop .holder{width:98px;height:98px;border-radius:10px;background:linear-gradient(#ffeecf,#f5dfaa);border:3px solid #c9a06a;box-shadow:0 3px 8px rgba(0,0,0,.15);transform:translate(-50%,-50%)}
.scene-shop .holder.filled{border-color:#ff9800;background:#ffe9b8;box-shadow:0 0 0 5px rgba(255,152,0,.2)}
/* 收集动画：默认=水果园，果子掉落→弹回挂枝→彩色落定 */
@keyframes gather{
  0%{transform:translate(0,0) rotate(0);filter:grayscale(100%)}
  45%{transform:translate(var(--gx),var(--gy)) rotate(var(--gr));filter:grayscale(100%)}
  70%{transform:translate(0,0) rotate(0);filter:grayscale(0%) scale(1.25)}
  85%{transform:translate(0,-12px) rotate(0);filter:grayscale(0%) scale(1.05)}
  100%{transform:translate(0,0) rotate(0);filter:grayscale(0%) scale(1)}
}
#fruitTree .fruit.gathering{animation:gather 1.2s ease forwards}
/* 菜园：蔬菜从土面破土冒出→站稳（定格在土面上方） */
@keyframes growUp{
  0%{transform:translate(-50%,18px) scale(.28) rotate(-10deg);opacity:.2;filter:grayscale(100%)}
  38%{transform:translate(-50%,-18px) scale(1.18) rotate(5deg);opacity:1;filter:grayscale(0%)}
  65%{transform:translate(-50%,8px) scale(.92) rotate(-3deg)}
  82%{transform:translate(-50%,-7px) scale(1.05) rotate(2deg)}
  100%{transform:translate(-50%,0) scale(1);filter:grayscale(0%)}
}
#fruitTree.scene-garden .fruit.gathering{animation:growUp 1.1s ease forwards}
.scene-garden .fruit{font-size:46px;filter:grayscale(100%);opacity:.35;transform:translate(-50%,18px) scale(.48);transform-origin:center bottom;text-shadow:0 3px 3px rgba(55,29,16,.3)}
.scene-garden .fruit.small{font-size:28px;opacity:.28;transform:translate(-50%,15px) scale(.42)}
.scene-garden .fruit.buried{font-size:30px;opacity:.82;filter:none;transform:translate(-50%,14px) scale(.68);text-shadow:0 2px 2px rgba(35,81,33,.3)}
.scene-garden .fruit.small.buried{font-size:21px;opacity:.68;transform:translate(-50%,11px) scale(.58)}
.scene-garden .fruit.unlocked{opacity:1;filter:none;transform:translate(-50%,0) scale(1)}
.scene-garden .fruit.grown{opacity:1;filter:none;transform:translate(-50%,0) scale(1)}
.scene-garden .fruit.grow-active{z-index:6}
@keyframes gardenRipple{0%{transform:translate(-50%,15px) scale(.35);filter:grayscale(100%)}55%{transform:translate(-50%,-10px) scale(1.25)}100%{transform:translate(-50%,0) scale(1);filter:grayscale(0%)}}
.scene-garden .fruit.ripple{animation:gardenRipple .45s ease forwards}
/* 教室：文具旋转着飘落贴稳在黑板上 */
@keyframes stickUp{
  0%{transform:translate(var(--gx),-60px) rotate(28deg);opacity:.3;filter:grayscale(100%)}
  60%{transform:translate(8px,4px) rotate(-8deg);opacity:1}
  80%{transform:translate(-3px,-2px) rotate(3deg);filter:grayscale(0%)}
  100%{transform:translate(0,0) rotate(0);filter:grayscale(0%)}
}
#fruitTree.scene-classroom .fruit.gathering{animation:stickUp 1s ease forwards}
/* 商店：商品转着圈飞进货架格 */
@keyframes shelfIn{
  0%{transform:translate(calc(var(--gx) * -1.6),8px) rotate(200deg);opacity:.3;filter:grayscale(100%)}
  55%{transform:translate(5px,-3px) rotate(-10deg);opacity:1}
  80%{transform:translate(-2px,2px) rotate(4deg);filter:grayscale(0%)}
  100%{transform:translate(0,0) rotate(0);filter:grayscale(0%)}
}

/* 中等屏（小平板）：树冠整体略缩 */

/* ===== 场景背景切换（果树/厨房/教室/商店） ===== */
#fruitTree .sc{position:absolute;inset:0;display:none}
#fruitTree.scene-orchard .sc-orchard{display:block}
#fruitTree.scene-garden .sc-garden{display:block}
#fruitTree.scene-classroom .sc-classroom{display:block}
#fruitTree.scene-shop .sc-shop{display:block}
/* 菜园：中间留出拼字空间，两侧是可持续生长的土垄 */
.sc-garden{background:linear-gradient(#b9e9ff 0 32%,#d9f4c2 32% 100%);overflow:hidden}
.sc-garden::before{content:'☀️';position:absolute;right:8%;top:7%;font-size:50px;filter:drop-shadow(0 0 16px rgba(255,201,44,.7));animation:sunPulse 4s ease-in-out infinite}
.sc-garden::after{content:'🦋   ✨   🐝';position:absolute;left:7%;top:18%;font-size:24px;letter-spacing:22px;animation:gardenFloat 9s ease-in-out infinite}
@keyframes gardenFloat{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(36px,12px) rotate(3deg)}}
.scene-garden .c-wall{display:none}
.scene-garden .garden-ground{position:absolute;left:0;right:0;bottom:0;height:69%;background:linear-gradient(180deg,#8bc95a,#58a944);clip-path:ellipse(80% 72% at 50% 100%)}
.scene-garden .garden-path{position:absolute;left:50%;bottom:-5%;width:28%;height:60%;transform:translateX(-50%);background:repeating-linear-gradient(90deg,#efd99a 0 24px,#e5c984 24px 48px);opacity:.72;clip-path:polygon(28% 0,72% 0,100% 100%,0 100%)}
.scene-garden .garden-fence{position:absolute;left:0;right:0;top:25%;height:82px;background:repeating-linear-gradient(90deg,transparent 0 42px,#d7924e 42px 62px,transparent 62px 100px),linear-gradient(#c47e42 0 14px,transparent 14px 48px,#c47e42 48px 62px,transparent 62px);opacity:.9;transform:rotate(-2deg)}
.scene-garden .garden-fence::after{content:'🌼  🌿  🌼  🌿  🌼  🌿  🌼';position:absolute;left:4%;top:62px;font-size:22px;letter-spacing:12px}
.scene-garden.all-unlocked .garden-ground{animation:groundCelebrate 2.4s ease-in-out infinite}
.scene-garden.all-unlocked .garden-fence::after{animation:flowerCelebrate 1.8s ease-in-out infinite}
@keyframes groundCelebrate{0%,100%{filter:saturate(1)}50%{filter:saturate(1.25) brightness(1.08)}}
@keyframes flowerCelebrate{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.04)}}
/* 教室：淡蓝墙 + 大黑板(贴卡) + 讲台摆设 */
.scene-classroom .c-wall{position:absolute;inset:0;background:linear-gradient(#d8ecfe,#f2f9ff 58%,#fff);z-index:0}
.scene-classroom .c-floor{position:absolute;bottom:0;left:0;right:0;height:14%;background:linear-gradient(#c9a06a,#b98a53);border-radius:40% 40% 0 0;z-index:0}
.scene-classroom .c-board{position:absolute;left:50%;top:calc(26% - 150px);transform:translateX(-50%);width:min(1120px,98vw);height:270px;background:linear-gradient(#3a3a44,#24242c);border-radius:16px;z-index:0;box-shadow:0 10px 24px rgba(0,0,0,.25),inset 0 0 0 10px #c9b27a;display:flex;align-items:flex-start;justify-content:center;padding-top:16px}
.scene-classroom .c-board::after{content:'✏️ 教室';color:#fff;font-size:24px;font-family:var(--font-kai);letter-spacing:8px;opacity:.85}
.scene-classroom .c-chalk{left:1%;top:4%}
.scene-classroom .c-desk{left:2%;bottom:8%;font-size:52px}
.scene-classroom .c-lamp{left:92%;bottom:16%;font-size:52px}
.scene-classroom .c-book{left:92%;top:46%}
/* 商店：暖黄墙 + 大货架(格子) + 商品摆件 */
.scene-shop .s-wall{position:absolute;inset:0;background:linear-gradient(#ffecbd,#fff4d8 55%,#fff);z-index:0}
.scene-shop .s-floor{position:absolute;bottom:0;left:0;right:0;height:14%;background:linear-gradient(#e8c98a,#d8b06a);border-radius:30% 30% 0 0;z-index:0}
.scene-shop .s-shelf{position:absolute;left:50%;top:calc(26% - 150px);transform:translateX(-50%);width:min(1120px,98vw);height:270px;background:linear-gradient(#c69a63,#a5763f);border-radius:16px;z-index:0;box-shadow:0 10px 24px rgba(0,0,0,.22),inset 0 -8px 0 rgba(88,52,16,.35);display:flex;align-items:flex-start;justify-content:center;padding-top:16px}
.scene-shop .s-shelf::after{content:'🛒 商店';color:#fff;font-size:24px;font-family:var(--font-kai);letter-spacing:8px;text-shadow:0 2px 6px rgba(0,0,0,.4);opacity:.9}
.scene-shop .s-sign{left:2%;top:4%;font-size:44px}
.scene-shop .s-basket{left:92%;top:4%}
.scene-shop .s-bag{left:90%;top:40%}
.scene-shop .s-candy{left:2%;top:46%}

/* ===== 书本地图（关卡选择） ===== */
.map-overlay{position:fixed;inset:0;background:rgba(45,58,74,.28);display:flex;align-items:center;justify-content:center;z-index:1200;opacity:0;visibility:hidden;transition:.3s}
.map-overlay.show{opacity:1;visibility:visible}
.map-book{width:min(560px,92%);max-height:90vh;overflow:auto;background:linear-gradient(160deg,#fffdf5,#ffe9c4);border:6px solid #c9a06a;border-radius:22px;padding:20px 22px;box-shadow:0 18px 50px rgba(0,0,0,.3);position:relative;transform:scale(.9);transition:transform .3s}
.map-overlay.show .map-book{transform:scale(1)}
.map-book::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:3px;background:rgba(201,160,106,.3)}
.map-title{text-align:center;font-size:28px;font-weight:700;color:#7a4a1f;margin-bottom:4px;letter-spacing:4px}
.map-sub{text-align:center;font-size:14px;color:#b0895a;margin-bottom:16px}
.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.map-card{background:#fff;border:3px solid #efe0c0;border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;transition:all .2s;box-shadow:0 4px 12px rgba(122,74,31,.12)}
.map-card.locked{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.map-card.done{border-color:#52c47a;box-shadow:0 4px 14px rgba(82,196,122,.3)}
.map-card:hover:not(.locked){transform:translateY(-3px);border-color:#4a90d9}
.map-card .mc-icon{font-size:46px;margin-bottom:6px;filter:grayscale(90%)}
.map-card:not(.locked) .mc-icon{filter:none}
.map-card .mc-name{font-size:18px;font-weight:700;color:#2d3a4a}
.map-card .mc-desc{font-size:12px;color:#8c99a8;margin-top:2px}
.map-card .mc-badge{display:inline-block;margin-top:8px;padding:3px 12px;border-radius:12px;background:#f0f6ff;color:#4a90d9;font-size:12px}
.map-card.locked .mc-badge{background:#eef1f5;color:#a0a8b5}
.map-card.done .mc-badge{background:#e6f7ec;color:#52c47a}

/* ===== 顶部提示区 ===== */
.header{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 16px;background:rgba(255,255,255,.92);border-radius:var(--radius);box-shadow:0 4px 16px rgba(74,144,217,.1);border:1px solid var(--border)}
.target-char{font-size:56px;font-weight:700;color:var(--primary);letter-spacing:4px;text-shadow:0 2px 8px rgba(74,144,217,.2)}
.target-info{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text-light)}
.pinyin{background:rgba(74,144,217,.1);padding:3px 12px;border-radius:20px;font-weight:600}
.progress{font-size:13px;color:var(--text-light)}

/* ===== 中间拼字区 ===== */
.build-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 0;min-height:240px}
.build-box{position:relative;width:100%;max-width:300px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;align-content:center;gap:12px;padding:18px;background:rgba(255,255,255,.9);border:3px dashed var(--primary);border-radius:var(--radius);box-shadow:inset 0 2px 8px rgba(74,144,217,.08);transition:border-color .3s}
/* 上下结构的字：插槽纵向排列（先在顶部放上方部件） */
.build-box.vertical{flex-direction:column;max-width:180px}
.build-box.vertical .build-slot{width:120px;height:120px}
.build-box.ready{border-color:var(--success);box-shadow:0 0 0 4px rgba(82,196,122,.15)}
.build-box.error{border-color:var(--error);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.build-slot{width:90px;height:90px;display:flex;align-items:center;justify-content:center;background:rgba(74,144,217,.05);border:2px solid var(--border);border-radius:12px;font-size:56px;color:var(--text-light);transition:all .2s}
.build-slot.filled{background:#fff;border-color:var(--primary);color:var(--text);box-shadow:0 2px 8px rgba(74,144,217,.15)}
.build-slot.correct{background:rgba(82,196,122,.12);border-color:var(--success);color:var(--success);animation:pop .3s}
.build-slot.wrong{background:rgba(255,120,117,.12);border-color:var(--error);color:var(--error);animation:shake .3s}
.build-slot.drag-over{background:rgba(74,144,217,.15);border-style:dashed}
@keyframes pop{0%{transform:scale(.8)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.build-hint{margin-top:12px;font-size:14px;color:var(--text-light);text-align:center;min-height:20px}

/* ===== 底部部件池 ===== */
.parts-pool{padding:16px;background:rgba(255,255,255,.92);border-radius:var(--radius);box-shadow:0 4px 16px rgba(74,144,217,.1);border:1px solid var(--border)}
.pool-label{font-size:13px;color:var(--text-light);margin-bottom:10px;text-align:center}
.parts-list{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.part-card{width:66px;height:66px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;background:var(--bg);border:2px solid var(--border);border-radius:12px;cursor:grab;touch-action:none;transition:all .2s;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.part-card:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:0 6px 16px rgba(74,144,217,.15)}
.part-card.dragging{opacity:.5;transform:scale(1.05) rotate(3deg);box-shadow:0 8px 24px rgba(74,144,217,.25)}
.part-card.used{background:rgba(82,196,122,.1);border-color:var(--success);color:var(--success);cursor:default;pointer-events:none;opacity:.55}
@media (max-width:480px){.part-card{width:58px;height:58px;font-size:30px}}

/* ===== 答对横幅（大号庆祝提示） ===== */
#successBanner{position:fixed;left:50%;top:31%;transform:translateX(-50%) scale(.5);z-index:900;pointer-events:none;opacity:0;visibility:hidden;white-space:nowrap;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#ffd54f,#ff9800 52%,#ff7043);color:#fff;padding:16px 34px;border-radius:46px;font-size:32px;font-weight:700;letter-spacing:2px;text-shadow:0 3px 8px rgba(190,80,0,.35);box-shadow:0 14px 40px rgba(255,152,0,.45);font-family:var(--font-kai)}
#successBanner .sb-icon{font-size:42px;filter:drop-shadow(0 2px 4px rgba(180,80,0,.3))}
#successBanner.show{visibility:visible;animation:sbPop 1.5s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes sbPop{
  0%{opacity:0;transform:translateX(-50%) scale(.5)}
  14%{opacity:1;transform:translateX(-50%) scale(1.1)}
  26%{transform:translateX(-50%) scale(1)}
  78%{opacity:1;transform:translateX(-50%) scale(1)}
  100%{opacity:0;transform:translateX(-50%) translateY(-28px) scale(1)}
}
@media (max-width:480px){#successBanner{top:27%;font-size:24px;padding:12px 24px}#successBanner .sb-icon{font-size:30px}}

/* ===== 反馈弹层 ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;visibility:hidden;transition:all .3s}
.overlay.show{opacity:1;visibility:visible}
.feedback{background:#fff;border-radius:20px;padding:28px 24px;text-align:center;max-width:300px;width:90%;box-shadow:0 16px 48px rgba(0,0,0,.15);transform:scale(.9);transition:transform .3s}
.overlay.show .feedback{transform:scale(1)}
.feedback-icon{font-size:60px;margin-bottom:10px}
.feedback-title{font-size:22px;font-weight:700;margin-bottom:6px}
.success{color:var(--success)}
.feedback-char{font-size:60px;font-weight:700;margin:10px 0;color:var(--primary)}
.feedback-meaning{font-size:15px;color:var(--text-light);margin-bottom:16px}
.feedback-btn{padding:12px 32px;font-size:15px;font-weight:600;border:none;border-radius:28px;cursor:pointer;background:var(--primary);color:#fff;transition:transform .15s}
.feedback-btn:active{transform:scale(.95)}
.sound-toggle{position:fixed;bottom:18px;right:18px;width:46px;height:46px;border-radius:50%;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:1100}
.map-toggle{position:fixed;bottom:76px;right:18px;width:46px;height:46px;border-radius:50%;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:1100}
.back-toggle{position:fixed;top:16px;left:16px;display:flex;align-items:center;gap:5px;padding:9px 13px;border-radius:22px;background:rgba(255,255,255,.94);border:1px solid var(--border);color:var(--text);font-family:var(--font-kai);font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:1100;transition:transform .15s,box-shadow .15s}
.map-overlay.show ~ .back-toggle{opacity:0;visibility:hidden;pointer-events:none}
.back-toggle:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.16)}
.back-toggle:active{transform:scale(.96)}
.sound-toggle.muted{opacity:.5}

/* ===== 水果/树动画 ===== */
@keyframes branchGlow{0%,100%{filter:grayscale(0%) drop-shadow(0 0 0 transparent)}50%{filter:grayscale(0%) drop-shadow(0 0 14px var(--fruit-glow))}}
#fruitTree .fruit.branch-glow{animation:branchGlow 1.1s ease}
@keyframes treeGlowAll{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25) drop-shadow(0 0 25px var(--fruit-glow))}}
#fruitTree.all-unlocked .canopy{animation:canopyBreathe 6s ease-in-out infinite,treeGlowAll 2s ease infinite}
</style>
</head>

// 本局题目：从当前关题库随机抽 8 个不重复的字
let roundQuestions=[];
function drawRound(){roundQuestions=shuffle(LEVELS[S.level].quests).slice(0,8)}
// 挂果位(8个)：坐标相对屏幕中心（x像素 / y相对26%视高基准像素）
// 果园场景：左右两翼分布
const FRUIT_POS = [
  {x:-470,y:-20}, // 0 左翼上排
  {x:-380,y:-20}, // 1
  {x:-470,y:90},  // 2 左翼下排
  {x:-380,y:90},  // 3

  {x:470,y:-20},  // 5

const FRUIT_POS_GARDEN = [
  {left:9,top:34},   // 0 左上
  {left:91,top:34},  // 1 右上
  {left:9,top:51},   // 2 左中上

  {left:91,top:67},  // 5 右中下

];
// 小果围绕主果的固定偏移（程序化生成：主果位置 + 偏移，省去手工写24个坐标）
const SMALL_OFFSETS=[{dx:-52,dy:-42},{dx:42,dy:-36},{dx:2,dy:40},{dx:-32,dy:30},{dx:35,dy:18}];
// 每颗主果周围的小果簇（涟漪点亮）：由主果位置 + SMALL_OFFSETS 程序化生成

// ============ 状态 ============
const S = {
  idx:0, level:0, sound:true, dragPart:null, placed:[], checking:false, unlocked:new Set(), unlockedSmall:new Set()
};
// 关卡进度：不保存，每次打开/刷新都从第一关、地图全灰重新开始
let completedCount=0;
function saveProgress(){}

// ============ DOM ============
const $id=id=>document.getElementById(id);
const canopyFruit=$id('canopyFruit');
const sceneParticles=$id('sceneParticles');
const buildBox=$id('buildBox'),partsList=$id('partsList');

// ============ 音效 ============
const AC=window.AudioContext||window.webkitAudioContext;let actx=null;
function tone(f,d,t='sine',v=.2){if(!S.sound)return;if(!actx)actx=new AC();const o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g).connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.stop(actx.currentTime+d)}
const okTone=()=>{tone(523,.15);setTimeout(()=>tone(659,.2),100);setTimeout(()=>tone(784,.25),220)};
const badTone=()=>{tone(349,.2,'triangle',.15);setTimeout(()=>tone(294,.3,'triangle',.15),120)};
const clickTone=()=>tone(880,.05,'sine',.1);
function speak(t){if(!S.sound||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.85;u.pitch=1.1;u.volume=.9;speechSynthesis.speak(u)}
const shuffle=a=>[...a].sort(()=>Math.random()-.5);

function clearSceneEffects(){
  sceneParticles.innerHTML='';
}

function highlightLearningPart(q,token=animId){
  if(S.level!==0||token!==animId)return;
  const root=$id('fruitTree');
  const wood=root.querySelector('.radical-wood');
  const grass=root.querySelector('.radical-grass');
  if(q.parts.includes('木')&&wood)wood.classList.add('active');
  if(q.parts.includes('艹')&&grass)grass.classList.add('active');
  setTimeout(()=>{
    if(token!==animId)return;
    wood?.classList.remove('active');
    grass?.classList.remove('active');
  },1500);
}

function burstAtElement(el,type='soil',token=animId){
  if(!el||token!==animId)return;
  const rect=el.getBoundingClientRect();
  const icons=type==='soil'?['•','·','✦','•','❋']:['✦','✧','•','✦','🍃'];
  icons.forEach((icon,i)=>{
    const p=document.createElement('span');
    p.className='particle'+(type==='spark'?' spark':'')+(type==='leaf'?' leaf':'');
    p.textContent=icon;
    p.style.left=(rect.left+rect.width/2)+'px';
    p.style.top=(rect.top+rect.height*.58)+'px';
    p.style.setProperty('--dx',`${(Math.random()*110-55).toFixed(0)}px`);
    p.style.setProperty('--dy',`${(-35-Math.random()*55).toFixed(0)}px`);
    p.style.setProperty('--rot',`${(Math.random()*180-90).toFixed(0)}deg`);
    p.style.animationDelay=`${i*45}ms`;
    sceneParticles.appendChild(p);
    setTimeout(()=>p.remove(),1100);
  });
  const ring=document.createElement('span');
  ring.className='burst-ring';
  ring.style.left=(rect.left+rect.width/2)+'px';
  ring.style.top=(rect.top+rect.height*.58)+'px';
  sceneParticles.appendChild(ring);
  setTimeout(()=>ring.remove(),850);
}

// ============ 场景/收集物渲染 ============
function renderTree(){
  // 场景背景切换
  $id('fruitTree').className='fruitTree '+(LEVELS[S.level].bg||'scene-orchard');
  clearSceneEffects();
  // 移除旧的底座与果实节点（保留挂果容器 canopyFruit）
  const olds=canopyFruit.querySelectorAll('.holder,.fruit');
  for(let i=olds.length-1;i>=0;i--)olds[i].remove();
  // 收集底座 + 主果：本局8题，未解锁(灰) / 已解锁(彩)
  const isGarden=S.level===1;
  const posArr=isGarden?FRUIT_POS_GARDEN:FRUIT_POS;
  for(let i=0;i<roundQuestions.length;i++){
    const pos=posArr[i];
    // 底座（厨房盘子/黑板贴卡/货架格；果园挂在树上不画）
    const h=document.createElement('span');
    h.className='holder';
    if(S.unlocked.has(i))h.classList.add('filled');
    if(isGarden){
      h.style.left=pos.left+'%';
      h.style.top=pos.top+'%';
    }else{
      h.style.left=`calc(50% + ${pos.x}px)`;
      h.style.top=`calc(26% + ${pos.y}px)`;
    }
    canopyFruit.appendChild(h);
    // 主果
    const f=document.createElement('span');
    f.className='fruit';
    if(isGarden)f.classList.add(S.unlocked.has(i)?'grown':'buried');
    if(S.unlocked.has(i))f.classList.add('unlocked');
    const qItem=roundQuestions[i];
    if(!isGarden && qItem.fruit.endsWith('.png')){
      const img=document.createElement('img');
      img.src=qItem.fruit;img.alt=qItem.fruitEmoji||'';img.style.cssText='width:56px;height:56px;object-fit:contain;border-radius:8px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))';
      f.appendChild(img);
    }else{
      f.textContent=isGarden?(S.unlocked.has(i)?(qItem.fruitEmoji||'🥬'):'🌱'):qItem.fruit;
    }
    f.dataset.index=i;
    f.style.left=h.style.left;f.style.top=h.style.top;
    f.style.setProperty('--delay',`${(i%4)*-.35}s`);
    canopyFruit.appendChild(f);
  }
  // 小果簇：由主果位置 + 固定偏移程序化生成，每簇3个
  posArr.forEach((pos,i)=>{
    SMALL_OFFSETS.forEach((o,j)=>{
      const sid=i*3+j;
      const s=document.createElement('span');
      s.className='fruit small';
      if(isGarden)s.classList.add(S.unlockedSmall.has(sid)?'grown':'buried');
      if(S.unlockedSmall.has(sid))s.classList.add('unlocked');
      const qItem=roundQuestions[i];
      if(!isGarden && qItem.fruit.endsWith('.png')){
        const img=document.createElement('img');
        img.src=qItem.fruit;img.alt=qItem.fruitEmoji||'';img.style.cssText='width:26px;height:26px;object-fit:contain;border-radius:4px';
        s.appendChild(img);
      }else{
        s.textContent=isGarden?(S.unlockedSmall.has(sid)?(qItem.fruitEmoji||'🥬'):'🌱'):qItem.fruit;
      }
      s.dataset.sid=sid;
      s.dataset.cluster=i;
      if(isGarden){
        s.style.left=(pos.left+o.dx/12)+'%';
        s.style.top=(pos.top+o.dy/12)+'%';
      }else{
        s.style.left=`calc(50% + ${pos.x+o.dx}px)`;
        s.style.top=`calc(26% + ${pos.y+o.dy}px)`;
      }
      s.style.setProperty('--delay',`${(sid%5)*-.22}s`);
      canopyFruit.appendChild(s);
    });
  });
  // 通关后整树发光（仅果树场景有意义，其余场景保持）
  const all=$id('fruitTree');
  const doneAll=S.unlocked.size>=roundQuestions.length;
  all.classList.toggle('all-unlocked',doneAll);
}

// ============ 渲染题目 ============
function renderQuestion(){
  const q=roundQuestions[S.idx];
  $id('targetChar').textContent=q.word;
  $id('targetPinyin').textContent=q.wordPinyin;
  $id('targetMeaning').textContent=q.fullWord+' '+(q.fruitEmoji||q.fruit);
  // 进度文字显示关卡名
  $id('progress').textContent=`${LEVELS[S.level].name} · 第 ${S.idx+1} / ${roundQuestions.length} 题`;
  $id('buildHint').textContent='将下方部件拖入上方方框拼成汉字';
  $id('buildHint').style.color='var(--text-light)';
  buildBox.className='build-box'+(q.layout?' '+q.layout:'');

  // 插槽（空）
  buildBox.innerHTML='';
  q.parts.forEach((_,i)=>{
    const s=document.createElement('div');
    s.className='build-slot';
    s.dataset.index=i;
    s.setAttribute('role','listitem');
    s.addEventListener('dragover',onDragOver);
    s.addEventListener('dragleave',onDragLeave);
    s.addEventListener('drop',onDrop);
    buildBox.appendChild(s);
  });

  // 部件池（打乱）
  partsList.innerHTML='';
  const shuffled=shuffle([...q.parts]);
  shuffled.forEach(p=>{
    const c=document.createElement('div');
    c.className='part-card';
    c.textContent=p;
    c.dataset.part=p;
    c.setAttribute('role','listitem');
    c.setAttribute('draggable','true');
    c.addEventListener('dragstart',onDragStart);
    c.addEventListener('dragend',onDragEnd);
    partsList.appendChild(c);
  });

  S.placed=[];S.checking=false;
  renderTree();
}

// ============ 拖拽事件 ============
function onDragStart(e){
  if(e.target.classList.contains('used')){e.preventDefault();return}
  S.dragPart=e.target.dataset.part;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed='copy';
  clickTone();
}
function onDragEnd(e){
  e.target.classList.remove('dragging');
  const overs=document.querySelectorAll('.build-slot.drag-over');
  overs.forEach(s=>s.classList.remove('drag-over'));
  S.dragPart=null;
}
function onDragOver(e){
  e.preventDefault();e.dataTransfer.dropEffect='copy';
  if(!e.currentTarget.classList.contains('filled'))e.currentTarget.classList.add('drag-over');
}
function onDragLeave(e){
  if(!e.currentTarget.contains(e.relatedTarget))e.currentTarget.classList.remove('drag-over');
}
function onDrop(e){
  e.preventDefault();const slot=e.currentTarget;slot.classList.remove('drag-over');
  if(S.checking||slot.classList.contains('filled'))return;
  if(!S.dragPart)return;
  const i=parseInt(slot.dataset.index,10);
  const q=roundQuestions[S.idx];
  const part=S.dragPart;
  slot.textContent=part;slot.classList.add('filled');
  S.placed.push({i,part});
  // 标记池中对应卡片为已用
  const useds=partsList.querySelectorAll(`.part-card[data-part="${part}"]:not(.used)`);
  if(useds.length>0){useds[0].classList.add('used')}
  if(S.placed.length===q.parts.length)setTimeout(()=>checkAnswer(q),250);
}

// ============ 判定 ============
function checkAnswer(q){
  if(S.checking)return;S.checking=true;
  let all=true;
  const slots=buildBox.querySelectorAll('.build-slot');
  const map={};
  S.placed.forEach(p=>{map[p.i]=p.part});
  q.parts.forEach((cp,i)=>{
    const pl=map[i];
    const slot=slots[i];
    if(pl===cp){slot.classList.add('correct')}else{slot.classList.add('wrong');all=false}
  });
  if(all)success(q);else fail(q);
}
// 答对横幅：弹出→站稳→上浮淡出，自动隐藏
function showBanner(){
  const b=$id('successBanner');
  b.classList.remove('show');
  void b.offsetWidth;   // 重置动画，便于连续答题再次弹出
  b.classList.add('show');
}

function success(q){
  okTone();speak(q.word);
  showBanner();
  highlightLearningPart(q);
  buildBox.classList.add('ready');
  $id('buildHint').textContent='拼对了！真棒！';
  $id('buildHint').style.color='var(--success)';
  // 播放果树动画：当前题水果索引 = S.idx
  playTreeAnim(S.idx);
}
function fail(q){
  badTone();
  buildBox.classList.add('error');
  $id('buildHint').textContent='有部件放错了哦，再试试吧';
  $id('buildHint').style.color='var(--error)';
  setTimeout(()=>{
    // 移除错误插槽，正确保留
    const slots=buildBox.querySelectorAll('.build-slot');
    const map={};S.placed.forEach(p=>{map[p.i]=p.part});
    q.parts.forEach((cp,i)=>{
      if(map[i]!==cp){slots[i].textContent='';slots[i].className='build-slot'}
    });
    // 恢复所有部件卡片（因为可重新拖）—简化：重建本题
    S.placed=S.placed.filter(p=>p.part===q.parts[p.i]);
    S.checking=false;
    buildBox.classList.remove('error');
    $id('buildHint').textContent='将下方部件拖入上方方框拼成汉字';
    $id('buildHint').style.color='var(--text-light)';
    // 恢复被占用卡片的 used 状态
    const parts=[];q.parts.forEach((cp,i)=>{if(map[i]!==cp)parts.push(cp)});
    parts.forEach(cp=>{
      const u=partsList.querySelector(`.part-card[data-part="${cp}"].used`);
      if(u)u.classList.remove('used');
    });
  },1400);
}

// 涟漪点亮：答对后，当前主果周围的小果逐个弹跳变彩（像水波扩散）
function rippleCluster(cluster,token=animId){
  SMALL_OFFSETS.forEach((o,j)=>{
    const sid=cluster*3+j;
    setTimeout(()=>{
      if(token!==animId)return;
      const el=canopyFruit.querySelector(`.fruit[data-sid="${sid}"]`);
      if(!el)return;
      el.classList.add('ripple');
      tone(880+j*150,.12,'sine',.14);
      setTimeout(()=>{
        if(token!==animId)return;
        el.classList.remove('ripple');
        el.classList.add('unlocked');
        if(S.level===1){
          el.classList.add('grown');
          el.textContent=roundQuestions[cluster].fruitEmoji||'🥬';
        }
        S.unlockedSmall.add(sid);
      },450);
    },j*180);
  });
}

// ============ 果树动画（答对） ============
async function playTreeAnim(fruitIndex){
  const my=++animId;   // 本轮动画令牌：一旦有新答题/手动跳题，令牌失效
  const q=roundQuestions[S.idx];
  const f=canopyFruit.querySelector(`.fruit[data-index="${fruitIndex}"]`);
  const holder=canopyFruit.querySelectorAll('.holder')[fruitIndex];
  const isGarden=S.level===1;
  // 1. 树枝发光
  if(f){f.classList.add('branch-glow');setTimeout(()=>f.classList.remove('branch-glow'),1100)}
  if(isGarden&&holder){
    holder.classList.add('grow-active');
    burstAtElement(holder,'soil',my);
  }
  await sleep(450);
  if(my!==animId)return;
  // 2. 果子掉落→弹回挂果位→彩色（gathering 动画）
  if(f){
    // 往下掉一小段 + 轻微旋转
    const dropX=(Math.random()*60-30);   // -30 ~ 30 px
    const dropY=Math.random()*40+70;     // 70 ~ 110 px
    f.style.setProperty('--gx',dropX+'px');
    f.style.setProperty('--gy',dropY+'px');
    f.style.setProperty('--gr',(Math.random()*40-20)+'deg');
    if(isGarden)f.classList.add('grow-active');
    f.classList.add('gathering');
  }
  await sleep(1200);
  if(my!==animId)return;
  // 3. 落定：该果子变彩色，稳固挂回树上，同时涟漪点亮周围小果
  if(f){f.classList.remove('gathering');f.classList.add('unlocked')}
  S.unlocked.add(fruitIndex);
  renderTree();
  const settled=canopyFruit.querySelector(`.fruit[data-index="${fruitIndex}"]`);
  burstAtElement(settled,isGarden?'spark':'leaf',my);
  rippleCluster(fruitIndex,my);
  // 4. 弹窗 + 语音（完整词）
  $id('feedbackIcon').textContent=q.fruitEmoji||q.fruit;
  $id('feedbackTitle').textContent=S.idx<roundQuestions.length-1?'学会了！':'通关啦！';
  $id('feedbackTitle').className='feedback-title success';
  $id('feedbackChar').textContent=q.fullWord;
  $id('feedbackMeaning').textContent=`拼出「${q.word}」· ${q.fullWord} ${q.fullPinyin}`;
  $id('nextBtn').textContent=S.idx<roundQuestions.length-1?'下一题':'查看地图';
  $id('overlay').classList.add('show');
  speak(q.fullWord);
  // 5. 等待2秒自动下一题（若期间用户已手动跳题/开始新答题，令牌失效则不跳）
  await sleep(2000);
  if(my!==animId)return;
  nextQuestion();
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let animId=0;let advancing=false;

// ============ 书本地图（关卡选择） ============
const mapOverlay=$id('mapOverlay'),mapGrid=$id('mapGrid');
function renderMap(){
  mapGrid.innerHTML='';
  LEVELS.forEach((lv,i)=>{
    const locked=false; // 测试模式：所有关卡始终开放
    const done=i<completedCount;
    const card=document.createElement('div');
    card.className='map-card'+(locked?' locked':'')+(done?' done':'');
    const badge=locked?'🔒 未解锁':(done?'⭐ 已完成':'▶ 开始');
    card.innerHTML=`<div class="mc-icon">${lv.icon}</div>
      <div class="mc-name">${lv.name}</div>
      <div class="mc-desc">${lv.desc}</div>
      <span class="mc-badge">${badge}</span>`;
    card.addEventListener('click',()=>{if(!locked)startLevel(i)});
    mapGrid.appendChild(card);
  });
}
function startLevel(i){
  animId++;              // 切换关卡时作废旧关卡的动画和自动跳转
  S.level=i;S.unlocked.clear();S.unlockedSmall.clear();S.idx=0;
  drawRound();renderQuestion();renderTree();
  mapOverlay.classList.remove('show');
}
function openMap(markCompleted=false){
  animId++;              // 打开地图时停止当前场景中的异步动画
  if(markCompleted){
    // 只有答完当前关的全部题目，才记录为已通关并解锁下一关
    completedCount=Math.max(completedCount,S.level+1);
    saveProgress();
  }
  renderMap();
  mapOverlay.classList.add('show');
}

function backToMap(){
  $id('overlay').classList.remove('show');
  openMap(false);
}

function nextQuestion(){
  if(advancing)return;   // 防止自动跳转与按钮点击重复触发导致跳题
  advancing=true;
  animId++;              // 作废所有在途的自动跳转（防止旧倒计时叠跳）
  $id('overlay').classList.remove('show');
  if(S.idx<roundQuestions.length-1){S.idx++;renderQuestion();advancing=false}
  else{openMap(true);advancing=false}   // 8题全部答对：打开书本地图点亮本关
}

// ============ 事件 ============
$id('nextBtn').addEventListener('click',nextQuestion);
$id('mapBtn').addEventListener('click',()=>openMap(false));
$id('backBtn').addEventListener('click',backToMap);
$id('soundToggle').addEventListener('click',()=>{
  S.sound=!S.sound;
  $id('soundToggle').textContent=S.sound?'🔊':'🔇';
  $id('soundToggle').classList.toggle('muted',!S.sound);
});

// ============ 初始化 ============
drawRound();                     // 先抽好第一关的8道题（渲染背景需要）
renderTree();                    // 把第一场景（果树园）画在幕布上
renderMap();
mapOverlay.classList.add('show');   // 再用半透明书本地图盖在上面选关
console.log('汉字拼拼乐 · 果树版 加载完成 ✨');
</script>
